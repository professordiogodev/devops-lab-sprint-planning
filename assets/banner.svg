<rect x="102" y="180" width="24" height="0" rx="4" fill="#a7f3d0" opacity=".9"><animate attributeName="height" values="0;70;70;0" keyTimes="0;.4;.85;1" dur="5s" begin="-1.50s" repeatCount="indefinite"/><animate attributeName="y" values="180;110;110;180" keyTimes="0;.4;.85;1" dur="5s" begin="-1.50s" repeatCount="indefinite"/></rect>
<rect x="138" y="180" width="24" height="0" rx="4" fill="#a7f3d0" opacity=".9"><animate attributeName="height" values="0;110;110;0" keyTimes="0;.4;.85;1" dur="5s" begin="-1.15s" repeatCount="indefinite"/><animate attributeName="y" values="180;70;70;180" keyTimes="0;.4;.85;1" dur="5s" begin="-1.15s" repeatCount="indefinite"/></rect>
<rect x="174" y="180" width="24" height="0" rx="4" fill="#a7f3d0" opacity=".9"><animate attributeName="height" values="0;140;140;0" keyTimes="0;.4;.85;1" dur="5s" begin="-0.80s" repeatCount="indefinite"/><animate attributeName="y" values="180;40;40;180" keyTimes="0;.4;.85;1" dur="5s" begin="-0.80s" repeatCount="indefinite"/></rect>
