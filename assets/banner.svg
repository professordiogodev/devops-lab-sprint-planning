<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="324" viewBox="0 0 1000 324" role="img" aria-label="Scrum: Plan the Sprint With Real Constraints">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#431407"/><stop offset="1" stop-color="#c2410c"/></linearGradient><radialGradient id="glow" cx=".85" cy=".5" r=".6"><stop offset="0" stop-color="#a7f3d0" stop-opacity=".28"/><stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/></radialGradient></defs>
<rect width="1000" height="324" rx="18" fill="url(#bg)"/><rect width="1000" height="324" rx="18" fill="url(#glow)"/>
<circle cx="60" cy="40" r="3" fill="#a7f3d0" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/></circle>
<text x="48" y="64" font-size="14" letter-spacing="3" fill="#a7f3d0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700">DEVOPS BOOTCAMP · LAB</text>
<text x="48" y="112" font-size="40" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Scrum: Plan the Sprint</text>
<text x="48" y="160" font-size="40" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">With Real Constraints</text>
<text x="48" y="190" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">Monday, sprint planning. 24 stories, a team missing three people-days,</text>
<text x="48" y="212" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">a production bug, a dependency chain and a stakeholder who wants</text>
<text x="48" y="234" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">everything. Commit to a sprint you can actually deliver.</text>
<rect x="48" y="266" width="105" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#a7f3d0" stroke-opacity=".7"/><text x="62" y="287" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">60-75 min</text>
<rect x="165" y="266" width="114" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#a7f3d0" stroke-opacity=".7"/><text x="179" y="287" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Cost: free</text>
<g transform="translate(750,62)">
<path d="M12 180 H210 M12 180 V20" stroke="#a7f3d0" stroke-opacity=".6" stroke-width="3" fill="none"/>
